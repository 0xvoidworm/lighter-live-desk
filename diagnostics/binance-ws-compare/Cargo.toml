[package]
name = "binance-ws-compare"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[dependencies]
anyhow = "=1.0.104"
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-native-roots"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
